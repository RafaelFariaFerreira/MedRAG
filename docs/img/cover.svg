<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" width="1600" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><title>MedRAG — do PDF da aula à resposta com fonte</title><rect x="0" y="0" width="1600" height="640" rx="32" fill="#F6F5F1"/><g transform="translate(96 92) scale(0.04296875)"><rect x="0" y="0" width="1024" height="1024" rx="236" fill="#1F4E46"/><g transform="translate(512 512) translate(-509 -509)"><circle cx="468" cy="468" r="190" fill="none" stroke="#FFFFFF" stroke-width="68"/><line x1="612" y1="612" x2="766" y2="766" stroke="#FFFFFF" stroke-width="68" stroke-linecap="round"/><circle cx="496" cy="440" r="46" fill="#E07A45"/></g></g><text x="154.0" y="122.0" font-size="22" font-weight="600" fill="#171716" text-anchor="start" letter-spacing="-0.3">MedRAG</text><text x="93.0" y="292.0" font-size="60" font-weight="700" fill="#171716" text-anchor="start" letter-spacing="-2.2">Do PDF da aula</text><text x="93.0" y="364.0" font-size="60" font-weight="700" fill="#1F4E46" text-anchor="start" letter-spacing="-2.2">à resposta com fonte.</text><text x="96.0" y="428.0" font-size="22" font-weight="400" fill="#66645E" text-anchor="start" letter-spacing="-0.2">Um copiloto de estudos com RAG</text><text x="96.0" y="460.0" font-size="22" font-weight="400" fill="#66645E" text-anchor="start" letter-spacing="-0.2">para a prova de Anatomia Patológica.</text><text x="96.0" y="548.0" font-size="14" font-weight="500" fill="#A3A099" text-anchor="start" letter-spacing="0.3">Flutter  ·  SQLite  ·  BM25 no aparelho  ·  Claude API</text><rect x="936" y="96" width="568" height="448" rx="24" fill="#FFFFFF" stroke="#E1DFD7" stroke-width="1.2"/><rect x="1156" y="128" width="316" height="46" rx="23" fill="#1F4E46"/><text x="1314.0" y="157.0" font-size="16" font-weight="500" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">Achados do carcinoma papilífero?</text><text x="968" y="230" font-size="18" fill="#171716"><tspan>Núcleos em “vidro fosco”, sulcos nucleares</tspan></text><text x="968" y="260" font-size="18" fill="#171716"><tspan>e pseudoinclusões</tspan><tspan font-size="13" font-weight="700" fill="#D2662F" dy="-6"> 1</tspan><tspan dy="6"> </tspan><tspan>; corpos psamomatosos</tspan><tspan font-size="13" font-weight="700" fill="#D2662F" dy="-6"> 2</tspan><tspan dy="6"> </tspan></text><line x1="968" y1="300" x2="1472" y2="300" stroke="#E1DFD7" stroke-width="1.2"/><text x="968.0" y="336.0" font-size="11" font-weight="600" fill="#A3A099" text-anchor="start" letter-spacing="1.6">FONTES</text><rect x="968" y="352" width="178" height="38" rx="19" fill="none" stroke="#E1DFD7" stroke-width="1.2"/><text x="986.0" y="376.5" font-size="13" font-weight="700" fill="#D2662F" text-anchor="start" letter-spacing="0">1</text><text x="1004.0" y="376.5" font-size="14" font-weight="500" fill="#66645E" text-anchor="start" letter-spacing="0">Resumo · Tireoide</text><rect x="1158" y="352" width="154" height="38" rx="19" fill="none" stroke="#E1DFD7" stroke-width="1.2"/><text x="1176.0" y="376.5" font-size="13" font-weight="700" fill="#D2662F" text-anchor="start" letter-spacing="0">2</text><text x="1194.0" y="376.5" font-size="14" font-weight="500" fill="#66645E" text-anchor="start" letter-spacing="0">Prova 150 · Q7</text><rect x="968" y="462" width="504" height="50" rx="25" fill="#F6F5F1"/><text x="992.0" y="492.5" font-size="15" font-weight="400" fill="#A3A099" text-anchor="start" letter-spacing="0">Pergunte ao material…</text><circle cx="1447" cy="487" r="17" fill="#1F4E46"/><path d="M1441 487 L1453 487 M1448.5 482.5 L1453 487 L1448.5 491.5" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
